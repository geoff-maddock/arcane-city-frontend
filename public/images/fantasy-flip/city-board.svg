  <rect x="70" y="560" width="1040" height="90" rx="12" fill="#edd8c0" stroke="#704426" stroke-width="4"/>
  <text x="95" y="615" class="small">Combo Route Bonus  |  Repeat Visit Tax  |  Civic Event Tracker □□□□</text>
